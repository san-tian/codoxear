[package]
name = "codoxear-backend-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros", "json"] }
base64 = "0.22.1"
base64ct = "=1.6.0"
bytes = "=1.11.1"
cpufeatures = "=0.2.17"
ed25519-compact = "=2.1.1"
futures-util = "0.3.30"
hmac = "0.12.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
idna_adapter = "=1.0.0"
libc = "0.2"
openssl = { version = "0.10.78", features = ["vendored"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.36.0", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
indexmap = "=2.2.6"
toml = "=0.8.8"
web-push = { version = "=0.10.2", default-features = false }
